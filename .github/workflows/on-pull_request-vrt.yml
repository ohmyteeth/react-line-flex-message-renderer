name: VRT

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/on-pull_request-vrt.yml"
      - "packages/core/**"
      - "packages/native/**"
      - "packages/native-samples/**"
      - "packages/sample-fixtures/**"
      - "pnpm-lock.yaml"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/on-pull_request-vrt.yml"
      - "packages/core/**"
      - "packages/native/**"
      - "packages/native-samples/**"
      - "packages/sample-fixtures/**"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      update:
        description: "Take new baselines and upload them as an artifact instead of comparing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VRT_ARGS: ${{ inputs.update && '-u' || '' }}

jobs:
  ios:
    name: iOS (iPhone 17 Pro, iOS 26.5)
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # CocoaPods fails on non-UTF-8 locales.
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    defaults:
      run:
        working-directory: packages/native-samples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        working-directory: .
        run: pnpm turbo run build --filter=@ohmyteeth/react-native-line-flex-message-renderer...

      - name: Boot simulator
        run: |
          # Baselines were taken on this device; the same model and runtime keep the rendering identical.
          udid=$(xcrun simctl list devices available -j | jq -r '.devices["com.apple.CoreSimulator.SimRuntime.iOS-26-5"][] | select(.name == "iPhone 17 Pro") | .udid' | head -n 1)
          test -n "$udid"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      - name: Prebuild
        run: pnpm exec expo prebuild --platform ios

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/reactnativelineflexmessagerenderersample.xcworkspace \
            -scheme reactnativelineflexmessagerenderersample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath ios/build \
            build | xcbeautify

      - name: Start Metro
        run: |
          nohup pnpm exec expo start --port 8081 > metro.log 2>&1 &
          until curl -sf http://localhost:8081/status; do sleep 1; done

      - name: Launch app
        run: |
          xcrun simctl install "$SIMULATOR_UDID" ios/build/Build/Products/Debug-iphonesimulator/reactnativelineflexmessagerenderersample.app
          xcrun simctl launch "$SIMULATOR_UDID" com.natsuneko.react-native-line-flex-message-renderer-sample

      - name: Run VRT
        run: pnpm vrt:ios $VRT_ARGS

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-ios-diffs
          path: |
            packages/native-samples/__vrt__/ios/__diffs__/
            packages/native-samples/metro.log

      - name: Upload baselines
        if: inputs.update
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-ios-baselines
          path: |
            packages/native-samples/__vrt__/ios/
            !packages/native-samples/__vrt__/ios/__diffs__/

  android:
    name: Android (Pixel 10 Pro, API 37.2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: packages/native-samples
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build libraries
        working-directory: .
        run: pnpm turbo run build --filter=@ohmyteeth/react-native-line-flex-message-renderer...

      - name: Prebuild
        run: pnpm exec expo prebuild --platform android

      - name: Build app
        working-directory: packages/native-samples/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64

      - name: Start Metro
        run: |
          nohup pnpm exec expo start --port 8081 > metro.log 2>&1 &
          until curl -sf http://localhost:8081/status; do sleep 1; done

      - name: Run VRT
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: "37.2"
          target: google_apis_playstore_ps16k
          arch: x86_64
          profile: pixel_10_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: packages/native-samples
          # Each line runs in its own shell. `-g` grants the local network permission that Android 17 asks for.
          script: |
            adb install -g android/app/build/outputs/apk/debug/app-debug.apk
            adb reverse tcp:8081 tcp:8081
            adb shell monkey -p com.natsuneko.reactnativelineflexmessagerenderersample -c android.intent.category.LAUNCHER 1
            pnpm vrt:android $VRT_ARGS

      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-android-diffs
          path: |
            packages/native-samples/__vrt__/android/__diffs__/
            packages/native-samples/metro.log

      - name: Upload baselines
        if: inputs.update
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vrt-android-baselines
          path: |
            packages/native-samples/__vrt__/android/
            !packages/native-samples/__vrt__/android/__diffs__/
